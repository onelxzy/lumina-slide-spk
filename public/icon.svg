<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131926"/>
      <stop offset="55%" stop-color="#0d121c"/>
      <stop offset="100%" stop-color="#090c14"/>
    </linearGradient>
    <radialGradient id="ambient" cx="65%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090c14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="backCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3f6b"/>
      <stop offset="100%" stop-color="#1b2845"/>
    </linearGradient>
    <linearGradient id="frontCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="52%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="skyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="sunOrb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04070d" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Base squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ambient)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>

  <!-- Back photo card (tilted) -->
  <g transform="rotate(9 272 246)" filter="url(#cardShadow)">
    <rect x="118" y="96" width="296" height="280" rx="34" fill="url(#backCard)" stroke="#60a5fa" stroke-opacity="0.28" stroke-width="2.5"/>
  </g>

  <!-- Front photo card -->
  <g transform="rotate(-4 240 264)" filter="url(#cardShadow)">
    <rect x="90" y="116" width="308" height="292" rx="36" fill="#131c2e" stroke="#93c5fd" stroke-opacity="0.38" stroke-width="2.5"/>
    <!-- Inner photo viewport -->
    <rect x="108" y="134" width="272" height="202" rx="22" fill="url(#frontCard)"/>
    <rect x="108" y="134" width="272" height="140" rx="22" fill="url(#skyGlow)"/>
    <!-- Stylized mountain / horizon -->
    <path d="M108 294 L182 222 C190 214 202 214 210 222 L252 264 L290 232 C298 225 310 225 318 232 L380 288 L380 314 C380 326 370 336 358 336 L130 336 C118 336 108 326 108 314 Z" fill="#0f172a" fill-opacity="0.52"/>
    <!-- Luminous sun/orb -->
    <circle cx="316" cy="184" r="24" fill="url(#sunOrb)"/>
    <!-- Subtle bottom frame bar -->
    <rect x="128" y="356" width="96" height="12" rx="6" fill="#e2e8f0" fill-opacity="0.72"/>
    <rect x="128" y="376" width="56" height="8" rx="4" fill="#94a3b8" fill-opacity="0.45"/>
    <!-- Play badge on right of bottom bar -->
    <circle cx="352" cy="369" r="20" fill="#3b82f6"/>
    <polygon points="346,359 346,379 363,369" fill="#ffffff"/>
  </g>
</svg>
